name: Mobile builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; release APK will use debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APK and App Bundle
        run: |
          flutter build apk --release --build-number="${{ github.run_number }}"
          flutter build appbundle --release --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "TheMuscleBuilder-${{ github.run_number }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "TheMuscleBuilder-${{ github.run_number }}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            TheMuscleBuilder-${{ github.run_number }}.apk
            TheMuscleBuilder-${{ github.run_number }}.aab
          if-no-files-found: error

  ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --build-number="${{ github.run_number }}"

      - name: Package IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find build/ios -name 'Runner.app' -type d | head -n 1)"
          fi
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -r -y "TheMuscleBuilder-${{ github.run_number }}.ipa" Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: TheMuscleBuilder-${{ github.run_number }}.ipa
          if-no-files-found: error

  publish-latest:
    name: Publish latest GitHub Release
    needs: [android, ios]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist

      - name: Download iOS artifact
        if: ${{ needs.ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: dist

      - name: Publish rolling latest release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          artifacts: dist/*
          body: |
            Automated build from `${{ github.sha }}` (run #${{ github.run_number }}).

            - **Android:** install the `.apk` on a phone (enable Install unknown apps).
            - **Play Store:** use the `.aab`.
            - **iOS:** the `.ipa` is unsigned. A paid Apple Developer account and signing secrets are required to install on a device or upload to TestFlight.
